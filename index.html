<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trayectoria de capital cultural y económico</title>
  <meta name="description" content="Cuestionario en línea que reconstruye la trayectoria de capital cultural y económico de una persona por etapas de vida, basado en el marco conceptual de Pierre Bourdieu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="titulo">Cuestionario</h1>
      <div class="topbar-der"><button class="btn chico" data-accion="perfiles">Perfiles guardados</button><span class="version" id="version"></span></div>
    </div>
    <div id="progreso" hidden>
      <div class="progreso-track"><div id="progreso-barra"></div></div>
      <p id="progreso-texto"></p>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <p>Basado en los conceptos de capital cultural y económico de Pierre Bourdieu (<em>La distinción</em>, 1979; <em>Las formas del capital</em>, 1986). Las respuestas se guardan solo en tu navegador y no se envían a ningún servidor.</p>
  </footer>

  <script src="js/questions.js"></script>

  <script src="js/app.js"></script>
